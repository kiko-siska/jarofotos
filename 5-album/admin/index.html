<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Správa webu – Jarofotos</title>
<meta name="description" content="Správa fotiek, textov a kódov pre klientov webu Jarofotos.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#141415">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23141415'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23E9E8E5' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preload" href="../../assets/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<a class="skip" href="#main">Preskočiť na obsah</a>

<header class="bar">
  <div class="wrap bar__in">
    <div class="bar__title">
      <h1>Správa webu</h1>
      <a class="bar__site" href="../" target="_blank" rel="noopener">Zobraziť web ↗</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sekcie správy" hidden>
      <button type="button" data-tab="photos" aria-current="page">Fotky</button>
      <button type="button" data-tab="texts">Texty</button>
      <button type="button" data-tab="codes">Kódy</button>
      <button type="button" data-tab="settings">Nastavenia</button>
    </nav>
    <div class="pub" id="pub" hidden>
      <span class="pub__state" id="dirty" role="status">Bez zmien</span>
      <button class="btn" type="button" id="btn-preview">Náhľad</button>
      <button class="btn btn--primary" type="button" id="btn-publish" disabled>Zverejniť zmeny</button>
    </div>
  </div>
</header>

<main class="wrap" id="main" tabindex="-1">
  <noscript><p class="notice">Správa webu potrebuje zapnutý JavaScript.</p></noscript>

  <section id="view-connect" aria-labelledby="h-connect" hidden></section>
  <section id="view-photos" aria-labelledby="tab-photos" hidden></section>
  <section id="view-texts" aria-labelledby="tab-texts" hidden></section>
  <section id="view-codes" aria-labelledby="tab-codes" hidden></section>
  <section id="view-settings" aria-labelledby="tab-settings" hidden></section>
</main>

<dialog id="dlg-edit" class="dlg" aria-labelledby="dlg-edit-h"></dialog>
<dialog id="dlg-publish" class="dlg" aria-labelledby="dlg-publish-h"></dialog>
<dialog id="dlg-preview" class="dlg dlg--wide" aria-labelledby="dlg-preview-h"></dialog>
<dialog id="dlg-code" class="dlg" aria-labelledby="dlg-code-h"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="admin.js"></script>
</body>
</html>
